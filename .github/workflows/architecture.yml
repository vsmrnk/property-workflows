# Архітектурні правила — окремий workflow, щоб не чіпати назви jobs у ci.yml (на них спирається ruleset).
# Кожне правило — швидкий скрипт (check:actions розбирає код компілятором TypeScript); пояснення — в ADR у docs/decisions/.
name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-tokens:
    name: "Дизайн-система: лише токени"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-design-tokens.mjs

  server-boundary:
    name: "Секретний ключ лише на сервері"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-server-boundary.mjs

  actions-claims:
    name: "Кожна дія перевіряє вхід"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Правило розбирає код компілятором TypeScript (devDependency), а не регулярними виразами.
      - run: npm ci
      - run: node scripts/check-actions-claims.mjs
