# Детерміновані ворота якості (WS8) — окремий workflow: назви jobs у ci.yml заморожені (на них тримається ruleset).
#   fallow   — fallow audit: мертвий код, складність, дублі, правила Next.js і «послаблені тести» — валить лише НОВІ
#              знахідки відносно бази PR (успадковані показує як контекст);
#   coverage — Vitest із покриттям v8: підлога для доменних файлів (vitest.coverage.config.mts), таблиця — у Summary;
#   deps     — npm audit залежностей продакшену: лише попередження (вивід npm audit недетермінований, job не червоніє).
# Тестові правила лінтера (@vitest/eslint-plugin) — в eslint.config.mjs, тобто вже в обов'язковому job app (ci.yml).
# Порядок впровадження: нові перевірки — дорадчі, доки не буде першого зеленого прогону на main; після нього
# «Ворота: fallow audit» і «Покриття: доменна підлога» додають в обов'язкові перевірки ruleset (deps — ніколи).
name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Новий push у PR скасовує застарілий прогін цього PR; прогони main не скасовуються (як у ci.yml).
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  FALLOW_TELEMETRY_DISABLED: "1"

jobs:
  fallow:
    name: "Ворота: fallow audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # audit шукає merge-base із базовою гілкою
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # З node_modules fallow правильно класифікує залежності (без них друкує WARN і може помилитися); версія — з lock-файлу.
      - run: npm ci
      # Значення подій — через env, а не ${{ }} у скрипті (template-injection). Push у main — уся різниця від стану до
      # push (github.event.before), а не лише останній коміт; без нього (нульовий SHA) — HEAD~1.
      - name: fallow audit (лише нове відносно бази)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="origin/$BASE_REF"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then BASE="$PUSH_BEFORE"
          else BASE="HEAD~1"; fi
          npx fallow audit --base "$BASE" --format github-summary | tee -a "$GITHUB_STEP_SUMMARY"

  coverage:
    name: "Покриття: доменна підлога"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vitest із покриттям (падає, якщо доменний файл нижче своєї підлоги)
        run: npm run test:coverage
      - name: Таблиця покриття → Summary
        if: always()
        run: npm run coverage:summary

  deps:
    name: "Порада: вразливі залежності"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Лише попередження: база advisories змінюється щодня, тож той самий коміт може стати «червоним» без змін у коді.
      - name: npm audit (лише залежності продакшену)
        continue-on-error: true
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=npm audit::Вразливі залежності продакшену — оновіть пакет (див. лог цього кроку)"
            exit 1
          fi

  # accounts.txt (паролі тестових акаунтів) — лише локально; у репо — тільки accounts.zip (AES-256). .gitignore
  # не зупиняє `git add -f`, а в PR #30 файл потрапив на main, і жодна перевірка цього не помітила (відгук викладача
  # до WS8, п. 1). Перевірка: `git add -f accounts.txt` у тестовій гілці робить job червоним.
  secrets-files:
    name: "Ворота: accounts.txt не в git"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # історія PR: файл, доданий і видалений у межах PR, лишився б у main після merge
      - name: accounts.txt не відстежується (у будь-якій теці) і не з'являвся в комітах PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pattern=':(glob)**/accounts.txt'
          # Окремий виклик: помилка git (немає індексу, зламаний checkout) валить job, а не читається як «файлу немає».
          tracked=$(git ls-files -- "$pattern")
          if [ -n "$tracked" ]; then
            echo "::error title=accounts.txt у git::$tracked — паролі тестових акаунтів. Приберіть: git rm --cached <шлях>; у репо — лише accounts.zip"
            exit 1
          fi
          # Коміти PR (чи нові коміти push у main): дерево КОЖНОГО коміту — `git log` без -m не бачить файла, доданого
          # в одному merge-коміті й видаленого в іншому. before з нулів (перший push гілки) — лише дерево вище.
          if [ -n "${BASE_SHA:-}" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "$BASE_SHA^{commit}" # невідома база (неповна історія) валить job, а не пропускає перевірку
            hits=""
            for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
              # Без grep -q: ранній вихід grep дав би SIGPIPE для ls-tree, і pipefail зробив би умову хибною.
              if git ls-tree -r --name-only "$commit" | grep -E '(^|/)accounts\.txt$' >/dev/null; then
                hits="$hits $(git rev-parse --short "$commit")"
              fi
            done
            if [ -n "$hits" ]; then
              echo "::error title=accounts.txt в історії PR::accounts.txt з'являвся в комітах цього PR — після merge паролі лишаться в історії main. Змініть паролі демо-акаунтів і перепишіть коміти PR без файла (git rebase -i), а не лише видаліть його."
              echo "$hits"
              exit 1
            fi
          fi
          echo "accounts.txt не відстежується й не з'являвся в комітах — OK"
